# The qualification contract, in one workflow.
#
# The meaningful body of this file is a single command: `python -m tools.ci`.
# The qualification contract itself lives in the repository, in Python, where
# a developer and an agent run exactly the same thing locally. The YAML here
# exists to provision an environment and then get out of the way.
#
# The alternative - reproducing the check list in YAML - is how local truth
# and CI truth drift apart. It is a second implementation of the same
# contract, and the second one is the one nobody runs locally.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. This workflow reads the repository and nothing else: no
# write token, no deployments, no release publishing. The release workflow is
# a separate file with its own, narrower permission.
permissions:
  contents: read

jobs:
  qualify:
    name: tools ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Pinned to an immutable commit SHA, not a tag. A tag is a name that can
      # be moved; the SHA is the code that actually ran, which is the only
      # version of this worth recording in provenance.
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The suite was qualified on CPython 3.14, and the runner's default is
      # not that. Pinning the interpreter keeps a verdict reproducible: a
      # failure caused by an interpreter difference is a failure of the
      # environment, not of the package, and it is indistinguishable from a
      # real one unless the interpreter is stated.
      - name: Provision the qualified interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # The suite inspects pixels and reads the packaged font, so it needs the
      # two libraries that read them. The gates under tools/ do not, which is
      # why they are standard-library only: a gate that cannot run without a
      # wheel is a gate that does not always run.
      - name: Install the runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      # The FigCraft projection gate rebuilds the committed project and
      # compares it byte for byte, so it needs the FigCraft engine and the
      # same font. The engine is pinned by its digest: a tool whose version
      # is not stated is a tool whose verdict is not reproducible.
      #
      # The font is the one this repository packages, and it is the only one
      # that matters: the text layout is part of the file, so a machine
      # without it lays the text out differently and the bytes differ with
      # the same script.
      #
      # It goes in through XDG_DATA_HOME, which is where the engine reads
      # user fonts from on Linux - its own documented mechanism, rather than
      # a fontconfig file the engine does not read the way one expects. An
      # earlier attempt to hand it over through FONTCONFIG_FILE worked
      # locally and found no font at all on the runner.
      #
      # The system's own fonts are not pinned, and do not need to be: the
      # same bytes come out with five fonts installed and with sixteen
      # hundred, because every glyph in the projection is in Space Grotesk
      # and nothing falls back.
      - name: Provision the FigCraft engine
        run: |
          set -euo pipefail
          url="https://github.com/storytold/figcraft/releases/download/v0.7.0/figcraft-0.7.0-linux-x86_64.tar.gz"
          expected="f3ddf6194d2bbd523cd3195df90fa2cd5782d3946fc7833b7f6bf88fda37908d"
          # Everything lands under the runner's temporary directory, not in
          # the checkout: the manifest gate reads the tree, and an engine
          # extracted into it would be reported as a hundred files the
          # manifest does not describe.
          curl -fsSL -o "$RUNNER_TEMP/figcraft-engine.tar.gz" "$url"
          echo "$expected  $RUNNER_TEMP/figcraft-engine.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/figcraft-engine"
          tar xzf "$RUNNER_TEMP/figcraft-engine.tar.gz" -C "$RUNNER_TEMP/figcraft-engine" --strip-components=1
          chmod +x "$RUNNER_TEMP/figcraft-engine/bin/figcraft-cli"
          "$RUNNER_TEMP/figcraft-engine/bin/figcraft-cli" --version

          mkdir -p "$RUNNER_TEMP/xdg/fonts"
          cp assets/fonts/SpaceGrotesk-native.ttf "$RUNNER_TEMP/xdg/fonts/"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/xdg" >> "$GITHUB_ENV"
          echo "FIGCRAFT_CLI=$RUNNER_TEMP/figcraft-engine/bin/figcraft-cli" >> "$GITHUB_ENV"

      # Report the environment before the qualification rather than after a
      # failure. A verdict without the versions that produced it is not
      # reproducible, and the versions are part of what the verdict is about.
      - name: Report the environment
        run: |
          set -euo pipefail
          python3 -VV
          python3 -c "import numpy, PIL; print('numpy', numpy.__version__); print('pillow', PIL.__version__)"
          "$FIGCRAFT_CLI" --version
          git rev-parse HEAD
          git status --porcelain && echo "(clean tree above)"

      # The single meaningful step. Everything above it is environment.
      - name: Qualification
        run: python3 -m tools.ci

      # Artifacts are CI artifacts, not commits. CI never writes evidence back
      # to the repository: that would make the run a mutation of the thing it
      # is verifying.
      - name: Retain the qualification record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification
          path: |
            dist/
          if-no-files-found: warn
          retention-days: 14
